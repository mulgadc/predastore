# Single-process development topology: one data shard and no parity.
# This is the fastest local mode and deliberately bypasses Reed-Solomon coding.

version = "1.0"
region = "ap-southeast-2"

[rs]
data = 1
parity = 0

[[host]]
id = 1
bind_addr = "127.0.0.1:6660"
public_addr = "127.0.0.1:6660"
data_dir = "data/host-1"

[[node]]
id = 1
host_id = 1
role = "shard-storage"

[[node]]
id = 2
host_id = 1
role = "state-replica"

