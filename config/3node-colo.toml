# 3-node cluster, fully colocated in one process (pipe transport).
#
# The same logical cluster as 3node.toml — 3 state-replica (Raft) nodes and
# 3 shard-storage (erasure-coded) nodes — but expressed as the new
# [[host]]/[[node]] topology with every node pinned to a single host. Launched
# as one process, all intra-cluster traffic goes over the in-process pipe:
#     s3d --config config/3node-colo.toml
# No network socket, no intra-cluster certs. The S3 HTTPS frontend is the only
# listener.

version = "1.0"
region = "ap-southeast-2"

[rs]
data = 2
parity = 1

# One host = one process. bind/public addrs are unused while every node is
# colocated (no network transport comes up); they matter only if nodes are
# split across processes.
[[host]]
id = 1
bind_addr = "127.0.0.1:6660"
public_addr = "127.0.0.1:6660"
data_dir = "/tmp/predastore/3node-colo/data"

# 3 shard-storage nodes (RS data=2 + parity=1 = 3 shards).
[[node]]
id = 1
host_id = 1
role = "shard-storage"

[[node]]
id = 2
host_id = 1
role = "shard-storage"

[[node]]
id = 3
host_id = 1
role = "shard-storage"

# 3 state-replica nodes (Raft quorum of 3).
[[node]]
id = 4
host_id = 1
role = "state-replica"

[[node]]
id = 5
host_id = 1
role = "state-replica"

[[node]]
id = 6
host_id = 1
role = "state-replica"

[[auth]]
access_key_id = "AKIAIOSFODNN7EXAMPLE"
secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
account_id = "123456789012"
policy = [
  { bucket = "*", actions = ["s3:*"] },
]
