# 7-host distributed cluster.
#
# Hosts are s3d processes: each owns one socket and one data directory.
# Nodes are roles pinned to a host; everything per-node derives from the
# host base and the node id (pipe name, ALPN key, data subdirectory).
#
# These hosts share one machine over loopback aliases, so each binds its
# own address rather than 0.0.0.0 — three processes cannot share a port.
#
# Run the whole cluster in one process:
#     s3d -config config/7node.toml
# Run one host per process:
#     s3d -config config/7node.toml -nodes 1,8
#
# No buckets defined - tests and benchmarks create their own.

version = "1.0"
region = "ap-southeast-2"

[rs]
data = 4
parity = 3

# Background compactor for the shard store. Omit interval_seconds to use
# the store default (300s).
# [compaction]
# interval_seconds = 300

