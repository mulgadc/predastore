# Three-host development cluster, RS(2,1).
#
# Each host is its own s3d process with a gate, a meta replica and a blob
# node. Colocated nodes talk over the in-process pipe; nodes on different
# hosts talk over QUIC. Nothing here names a transport — the pinning does.
#
#     ./scripts/start.sh 3host
#
# The hosts share one machine over loopback aliases, so each binds its own
# address: three processes cannot share a port on one.

version = 1
region = "ap-southeast-2"

[rs]
data = 2
parity = 1

# data_dir, tls_cert, tls_key and encryption_key are deliberately absent:
# they are host-local, and start.sh passes them as flags so this file stays
# identical on every machine.
[[host]]
id = 1
addr = "10.11.12.1"

  [[host.node]]
  id = 1
  role = "gate"
  port = 8443

  [[host.node]]
  id = 2
  role = "meta"
  port = 6660

  [[host.node]]
  id = 3
  role = "blob"
  port = 9991

[[host]]
id = 2
addr = "10.11.12.2"

  [[host.node]]
  id = 4
  role = "gate"
  port = 8443

  [[host.node]]
  id = 5
  role = "meta"
  port = 6660

  [[host.node]]
  id = 6
  role = "blob"
  port = 9991

[[host]]
id = 3
addr = "10.11.12.3"

  [[host.node]]
  id = 7
  role = "gate"
  port = 8443

  [[host.node]]
  id = 8
  role = "meta"
  port = 6660

  [[host.node]]
  id = 9
  role = "blob"
  port = 9991

