# Four-host development cluster, RS(2,1).
#
# Each host is its own s3d process with a gate, a meta replica and a blob
# node. Colocated nodes talk over the in-process pipe; nodes on different
# hosts talk over QUIC. Nothing here names a transport — the pinning does.
#
#     ./scripts/start.sh 4host
#
# The hosts share one machine over loopback aliases, so each binds its own
# address: four processes cannot share a port on one.
#
# Neither plane is split here, because there is one interface to split over. On
# a multi-homed machine the host's bind_addr keeps raft and blob traffic on the
# private interface, and the gate takes bind_addr = "0.0.0.0" for public S3.
#
# Four hosts mirror production, and the even meta count is the point: quorum is
# three, so one replica can be lost without stalling writes while the cluster
# still has a replica that must catch up afterwards. That is the shape faults
# are injected into by e2e-stress.sh.

version = 1
region = "ap-southeast-2"

# RS(2,1) over four hosts matches production: three shards spread across four
# blob nodes, so a shard set never depends on every host being up.
[rs]
data = 2
parity = 1

# The S3 gate's HTTP surface. enable_http2 advertises h2 over ALPN and
# defaults on. Only a client that offers h2 is given it, so this is a
# fleet-wide backstop rather than the way to keep one client off h2: a client
# multiplexing large bodies onto one connection should decline h2 itself.
# [s3]
# enable_http2 = true

# data_dir, tls_cert, tls_key and encryption_key are deliberately absent:
# they are host-local, and start.sh passes them as flags so this file stays
# identical on every machine.
[[host]]
id = 1
addr = "10.11.12.1"

  [[host.node]]
  id = 1
  role = "gate"
  port = 8443

  [[host.node]]
  id = 2
  role = "meta"
  port = 6660

  [[host.node]]
  id = 3
  role = "blob"
  port = 9991

