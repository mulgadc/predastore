# Cluster topology.
#
# Two levels: hosts and nodes.
#
#   host   the endpoint that owns a socket and a data directory. Hosts define
#          addressing; the launch flag selects which nodes a process runs:
#              s3d --config new.toml --nodes 1,2
#   node   a logical role (shard-storage or state-replica) pinned to a host via
#          host_id. Selected nodes run in the launching process as goroutines.
#
# Transport is derived from placement at launch:
#
#   - nodes in the SAME process   -> in-process pipe (no network, no auth)
#   - nodes in DIFFERENT processes-> network transport, dialing the peer
#                                    node's host public_addr (QUIC today)
#
# A process exposes ONE socket per transport; every node's raft, global-state,
# and shard traffic multiplexes as rpc streams over that socket, routed to the
# target node in-band.
#
# To run several processes on one machine over QUIC, define several hosts with
# distinct public_addrs (loopback aliases or extra ports) and launch each with
# its nodes. That is the operator's job; predastore binds and dials whatever
# you assign.
#
# TLS material (this host's server cert/key) is supplied via CLI flags, never
# here; dialers verify peers against the OS trust store. A process whose peers
# all run locally opens no network socket at all, so a single-process dev
# cluster needs no certs.

version = "1.0"
region = "ap-southeast-2"

[rs]
data = 2
parity = 1

# --- Hosts --------------------------------------------------------------------
# id           unique host id; the launch selector (-host) picks one.
# bind_addr    local listen address (0.0.0.0 binds all interfaces).
# public_addr  address other hosts dial. Split from bind_addr for NAT and
#              multi-homed boxes. QUIC-implied for now; see open question 3.
# data_dir     on-disk root for this host; its nodes derive their subdirs under
#              it from node id and role.

[[host]]
id = 1
bind_addr = "0.0.0.0:6660"
public_addr = "10.11.12.1:6660"
data_dir = "/var/lib/predastore"

[[host]]
id = 2
bind_addr = "0.0.0.0:6660"
public_addr = "10.11.12.2:6660"
data_dir = "/var/lib/predastore"

[[host]]
id = 3
bind_addr = "0.0.0.0:6660"
public_addr = "10.11.12.3:6660"
data_dir = "/var/lib/predastore"


# --- Nodes --------------------------------------------------------------------
# id       unique across the whole cluster, independent of role.
# host_id  the host this node runs on; nodes sharing a host_id are colocated.
# role     "shard-storage" (erasure-coded shards) or "state-replica" (Raft
#          consensus / global state).

[[node]]
id = 1
host_id = 1
role = "shard-storage"

[[node]]
id = 2
host_id = 1
role = "state-replica"

[[node]]
id = 3
host_id = 2
role = "shard-storage"

[[node]]
id = 4
host_id = 2
role = "state-replica"

[[node]]
id = 5
host_id = 3
role = "shard-storage"

[[node]]
id = 6
host_id = 3
role = "state-replica"

# Mixing is unconstrained, expressed by how nodes map to hosts:
#   - Spread:    one host per machine; peers talk QUIC.
#   - Colocate:  point two nodes at the same host_id -> they share a process and
#                talk over the pipe (above, each host pairs a shard-storage and
#                a state-replica node).
#   - Same box:  define two hosts with loopback public_addrs and run both on one
#                machine -> their nodes talk QUIC over loopback.

# --- External S3 credentials --------------------------------------------------
# client -> S3 gateway SigV4: the OUTWARD trust boundary, untouched by the wire
# migration. The old per-node access keys are gone; intra-cluster auth is the
# verified server certificate (QUIC) or same-process trust (pipe).

[[auth]]
access_key_id = "AKIAIOSFODNN7EXAMPLE"
secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
account_id = "123456789012"
policy = [
  { bucket = "*", actions = ["s3:*"] },
]

# =============================================================================
# OPEN QUESTIONS
# =============================================================================
#
# 1. Two id spaces: host ids (1-3) and node ids (1-6) both start at 1 and can
#    collide in conversation/logs. Confirm nothing downstream conflates them or
#    assumes per-role node numbering.
#
# 2. The S3 API frontend (client-facing HTTPS) is not modeled here. Is it a
#    third role on a host, a property of every host, or its own top-level [s3]
#    block?
#
# 3. bind_addr/public_addr are single addresses with QUIC implied. When a second
#    transport (tcp, ...) lands, do these become per-transport (a map, or
#    parallel fields), and who picks when a host offers more than one?
