# Predastore end-to-end suites.
#
# Split out of Build and Test so a pull request is not gated on a four-node
# cluster, and so the two suites that already existed but were invoked by no
# workflow finally run somewhere.
#
# Build and Test keeps a trimmed compatibility job on the pull-request path.
# The point of the split is to move the slow half, not to stop checking the S3
# surface before a merge.
name: E2E

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - Dockerfile
      - .dockerignore
      - "deploy/**"
      - "config/**"
      - "scripts/**"
      - .github/workflows/predastore-e2e.yml
  workflow_dispatch:
    inputs:
      smoke_suites:
        description: "Smoke suites to run (empty = all: image aws rclone restic registry)"
        required: false
        default: ""
      stress_scenarios:
        description: "Stress scenarios to run (empty = the eleven this job runs; name partial-put or multipart-upload to add them)"
        required: false
        default: ""
      run_performance:
        description: "Also run the Warp performance suite"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  compatibility:
    name: S3 Compatibility (cluster)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Builds the image the same way an operator would, which is also the
      # only place the FIPS build guard runs: a binary built without GOFIPS140
      # compiles cleanly and then panics in init().
      - name: Build Image
        run: make docker-build

      - name: Start Cluster
        run: make compose-up

      # Every gate answers for the whole cluster, so waiting on one is enough
      # to know the cluster elected a leader and opened its blob nodes.
      - name: Wait for Readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9099/readyz >/dev/null; then
              curl -sS http://127.0.0.1:9099/readyz; echo; exit 0
            fi
            sleep 2
          done
          echo "cluster did not become ready" >&2
          docker compose -f deploy/compose.cluster.yml logs --tail 50
          exit 1

      # Every failing check fails this job. The suite exists to say whether
      # predastore is S3 compatible, and it is not yet, so this stays red until
      # the remaining gaps close. The baseline is still read, to mark each
      # failure as a known gap or a new one in the job summary.
      - name: Smoke Suite
        run: make docker-smoke-strict SMOKE_SUITES="${{ inputs.smoke_suites }}"

      - name: Cluster Logs
        if: failure()
        run: docker compose -f deploy/compose.cluster.yml logs --tail 200

      - name: Stop Cluster
        if: always()
        run: make compose-down

  conformance:
    name: S3 Conformance (ceph/s3-tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache-dependency-path: "go.sum"
          go-version-file: "go.mod"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: make build

      # No container here. The suite needs the three accounts and the us-east-1
      # region that only config/s3tests.toml carries, and render-config.sh emits
      # exactly one account, so the image cannot serve this run without being
      # handed a mounted profile.
      - name: Start Cluster
        run: ./scripts/start.sh -w s3tests

      # Comparison, never strict. Predastore fails a large part of s3-tests and
      # will for a long while, so the question this job answers is whether the
      # branch moved anything, not whether the suite is green.
      #
      # Bounded below the job timeout on purpose: a job that hits its own
      # timeout skips every later step, including the manifest upload, so the
      # one artefact that would explain the failure is never produced.
      - name: Conformance Suite
        timeout-minutes: 20
        run: make s3-tests

      - name: Upload Manifest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: s3-tests-manifest
          path: /tmp/predastore-s3-tests/manifest.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Cluster Logs
        if: failure()
        run: tail -n 200 /tmp/predastore/s3tests/logs/*.log

      - name: Stop Cluster
        if: always()
        run: ./scripts/stop.sh s3tests

  # The scenario list is a job rather than a literal in the matrix so the
  # dispatch input can still name the two the default set leaves out.
  stress-plan:
    name: Stress (plan)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      # Eleven of the thirteen. partial-put fails today on an unbounded inbound
      # body read, and multipart-upload dies restarting its cluster between
      # part sizes on about two hosted runs in three. Both are covered by the
      # spinifex nightly, and either can be named in the dispatch input.
      - name: Choose Scenarios
        id: plan
        env:
          REQUESTED: ${{ inputs.stress_scenarios }}
        run: |
          set -euo pipefail
          default="repair handoff node-rejoin node-resync node-rebuild last-modified large-object concurrent-put torn-overwrite stale-shard freeze"
          # shellcheck disable=SC2086
          printf '%s\n' ${REQUESTED:-$default} | jq -Rsc 'split("\n") | map(select(length > 0))' \
            | sed 's/^/scenarios=/' >> "$GITHUB_OUTPUT"

  stress:
    name: Stress (${{ matrix.scenario }})
    needs: stress-plan
    # A hosted runner per scenario rather than all of them in sequence on one
    # box. The scenarios are mostly deliberate waiting rather than compute, so
    # in sequence they spend twenty minutes of wall clock doing about three
    # minutes' worth of work each, and they queue behind the performance job
    # for the one self-hosted runner while they do it.
    runs-on: ubuntu-26.04
    # No leg has taken over three minutes. This is room for a bad run.
    timeout-minutes: 30

    strategy:
      # A red scenario must not cancel the others: the whole point of scenario
      # granularity is that each one reports for itself.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.stress-plan.outputs.scenarios) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: "go.mod"

      # large-object sizes itself to the disk it finds and says so when it
      # skips. A hosted runner has offered 91GiB and four cores, which is
      # enough for both its sizes, but that is a fact worth re-reading in the
      # log rather than assuming.
      - name: Runner Capacity
        run: |
          set -euo pipefail
          printf 'cores: %s\n' "$(nproc)"
          free -g
          df -h "${TMPDIR:-/tmp}" /

      # A failing scenario fails its own leg. stress-gate.sh still reads the
      # baseline, so a known gap is reported as one rather than as a surprise.
      # The work directory holds the node logs, and the run deletes it on the
      # way out. Keeping it costs nothing on a runner that is discarded whole.
      - name: Run Scenario
        env:
          STRESS_KEEP_WORK: "1"
        run: make e2e-stress-strict STRESS_SCENARIOS="${{ matrix.scenario }}"

      # A scenario that dies while starting a cluster never reaches the point
      # where it copies node logs into its results directory, so the artifact
      # explains everything except the failures worth explaining.
      - name: Node Logs
        if: failure()
        run: |
          set -uo pipefail
          for d in "$HOME"/.cache/predastore-e2e/predastore-e2e-stress.*/predastore/*/logs /tmp/predastore-e2e-stress.*/predastore/*/logs; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              printf '\n===== %s =====\n' "$f"
              tail -50 "$f"
            done
          done

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stress-${{ matrix.scenario }}
          path: scripts/bench/results/e2e-stress/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Performance (Warp, bare metal)
    # The runner only drives ssh/scp against the hardware hosts and holds no
    # cluster data of its own, apart from the loopback run below.
    runs-on: [self-hosted, ci-predastore]
    # Four measurement passes now rather than one: two loopback and two on the
    # hardware, of which the compare preset is much the longest. A single smoke
    # pass was landing inside 30, so this leaves the same margin again.
    timeout-minutes: 90
    # inputs is null on a push, and GitHub coerces both sides of != to a
    # number there, so the event has to be checked first.
    if: github.event_name != 'workflow_dispatch' || inputs.run_performance

    # A fixed group with no ref in it, so runs across every branch queue behind
    # each other, and shared with the stress job because one runner serves
    # both. Killing a benchmark part way through leaves a cluster and its data
    # behind on several machines, which is why this waits rather than cancels.
    concurrency:
      group: predastore-self-hosted
      cancel-in-progress: false

    # The target hosts, their addresses and the directory the cluster is
    # deployed to are deployment facts, not repository ones. They are supplied
    # by repository variables and the job fails if any is unset.
    env:
      HW_HOSTS: ${{ vars.PREDASTORE_HW_HOSTS }}
      HW_ADDRS: ${{ vars.PREDASTORE_HW_ADDRS }}
      HW_ROOT: ${{ vars.PREDASTORE_HW_ROOT }}
      # One ref: the commit under test, rather than the script's own default of
      # several refs for a before/after comparison.
      HW_REFS: ci:${{ github.sha }}

    steps:
      # The hardware hosts also carry the nested dev clusters and engineers'
      # workstation VMs. A sentinel on the RUNNER or a repository variable
      # pauses this job cleanly rather than racing manual work on them.
      - name: Manual-work / cluster-in-use mutex gate
        id: gate
        env:
          REPO_VAR_PAUSED: ${{ vars.CI_PREDASTORE_HW_PAUSED }}
        run: |
          set -euo pipefail
          PAUSED=false
          if [ -f "$HOME/.ci-predastore-hw-paused" ]; then
            PAUSED=true
            echo "::warning::paused via the ~/.ci-predastore-hw-paused sentinel on the runner; manual work is in progress on the hardware hosts. Remove the file to resume CI."
          fi
          if [ "$(echo "${REPO_VAR_PAUSED:-}" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            PAUSED=true
            echo "::warning::paused via repository variable CI_PREDASTORE_HW_PAUSED=true."
          fi
          echo "paused=${PAUSED}" >> "$GITHUB_OUTPUT"

      - name: Paused — nothing to do
        if: steps.gate.outputs.paused == 'true'
        run: echo "paused for manual work; exiting without touching the hardware hosts."

      # Checked before any ssh. HW_ROOT is deleted recursively on every host at
      # the end of a run, so a shallow path here would be destructive: require
      # an absolute path at least three components deep.
      - name: Check required configuration
        id: config
        if: steps.gate.outputs.paused != 'true'
        run: |
          set -euo pipefail
          fail=0
          for name in HW_HOSTS HW_ADDRS HW_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::repository variable PREDASTORE_${name} is not set"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          if [ "$(wc -w <<< "$HW_HOSTS")" -ne "$(wc -w <<< "$HW_ADDRS")" ]; then
            echo "::error::PREDASTORE_HW_HOSTS and PREDASTORE_HW_ADDRS name a different number of hosts"
            exit 1
          fi
          case "$HW_ROOT" in
            /*/*/*) ;;
            *) echo "::error::PREDASTORE_HW_ROOT must be an absolute path at least three components deep; it is deleted recursively on every host"; exit 1 ;;
          esac

      - name: Checkout Code
        if: steps.gate.outputs.paused != 'true'
        uses: actions/checkout@v7

      # runner.temp is not reachable from job-level env:, and the runner's /tmp
      # may be tmpfs, so HW_WORK is resolved here against RUNNER_TEMP.
      - name: Resolve HW_WORK
        if: steps.gate.outputs.paused != 'true'
        run: echo "HW_WORK=$RUNNER_TEMP/hwbench-ci" >> "$GITHUB_ENV"

      # Cached off, unlike the hosted jobs. This runner keeps its module and
      # build caches on local disk between runs, so the action was downloading
      # a 3.4 GB archive of them from GitHub every time: 2m46s of a 6m job to
      # fetch what was already sitting next to it, then 25s deciding whether
      # to upload it back. The toolchain itself is found locally in 0.1s.
      - name: Setup Go
        if: steps.gate.outputs.paused != 'true'
        uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: "go.mod"

      # hwbench.sh's on() shells out to plain `ssh $host` with no -i or -F, so
      # the identity has to be this runner user's default. The Host stanzas are
      # derived from HW_HOSTS rather than named here.
      - name: Install SSH key for the hardware hosts
        if: steps.gate.outputs.paused != 'true'
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/predastore-hw-ci"
          printf '%s\n' "${{ secrets.PREDASTORE_HW_SSH_KEY }}" > "$HOME/.ssh/predastore-hw-ci"
          printf '%s\n' "${{ secrets.PREDASTORE_HW_KNOWN_HOSTS }}" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          for target in $HW_HOSTS; do
            {
              echo "Host ${target#*@}"
              echo "  User ${target%@*}"
              echo "  IdentityFile $HOME/.ssh/predastore-hw-ci"
              echo "  IdentitiesOnly yes"
            } >> "$HOME/.ssh/config"
          done
          chmod 600 "$HOME/.ssh/config"

      # cmd_tools ships the AWS CLI from this path on the RUNNER to the tools
      # host rather than installing it, and clean removes it from that host
      # every run, so it has to be present here every run.
      - name: Check AWS CLI v2 is present on the runner
        if: steps.gate.outputs.paused != 'true'
        run: |
          set -euo pipefail
          if [ ! -d /usr/local/aws-cli ]; then
            echo "::error::/usr/local/aws-cli is missing on this runner. Install AWS CLI v2 there once before this job can run." >&2
            exit 1
          fi

      # cmd_build worktrees each ref under $HW_WORK and never removes it, so a
      # fresh sha every run would accumulate them. Pruning here rather than in
      # the script leaves hwbench.sh's long-lived work dir behaviour alone.
      - name: Clean stale hwbench work dir
        if: steps.gate.outputs.paused != 'true'
        run: |
          set -euo pipefail
          rm -rf "$HW_WORK"
          git worktree prune

      - name: Install warp
        if: steps.gate.outputs.paused != 'true'
        run: make warp-install

      # The bare-metal numbers have no denominator without this. The same code
      # and the same workloads with the network taken out is what says whether
      # three hosts are worth having, and PERF_CONFIGS covers 1host and 3host.
      #
      # It runs before the hardware cluster starts rather than after it stops:
      # if this runner is one of the hardware hosts, a loopback cluster beside
      # a live one measures neither of them.
      # 3host only. The 1host profile registers a readiness check that holds a
      # typed-nil meta server, so the admin sample loop segfaults s3d three
      # seconds into startup. Put 1host back when that is fixed.
      - name: Run Warp Suite (loopback)
        if: steps.gate.outputs.paused != 'true'
        env:
          # /tmp here may be tmpfs and a 30s PUT workload stages gigabytes
          # through it, so the script's work directory is steered off it.
          TMPDIR: ${{ runner.temp }}
          PERF_RESULTS_ROOT: scripts/bench/results/e2e-performance-loopback
          PERF_CONFIGS: 3host
        run: make e2e-performance

      # The pass above puts 1 MiB objects, where erasure coding and the disk
      # dominate and per-operation cost disappears into them. Most real S3
      # traffic is smaller than this, so the metadata path needs its own pass.
      #
      # The part size stays at 5 MiB because S3 rejects a smaller non-final
      # part, so multipart-put repeats what it already did. put and get are
      # the two that change shape, and concurrency rises to make them bite.
      - name: Run Warp Suite (loopback, small objects)
        if: steps.gate.outputs.paused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PERF_RESULTS_ROOT: scripts/bench/results/e2e-performance-loopback-small
          PERF_CONFIGS: 3host
          PERF_PUT_SIZE: 64KiB
          PERF_GET_SIZE: 64KiB
          PERF_CONCURRENT: 16
        run: make e2e-performance

      - name: hwbench build
        if: steps.gate.outputs.paused != 'true'
        run: scripts/bench/hw/hwbench.sh build

      - name: hwbench deploy
        if: steps.gate.outputs.paused != 'true'
        run: scripts/bench/hw/hwbench.sh deploy ci

      - name: hwbench tools
        if: steps.gate.outputs.paused != 'true'
        run: scripts/bench/hw/hwbench.sh tools

      - name: hwbench start
        if: steps.gate.outputs.paused != 'true'
        run: scripts/bench/hw/hwbench.sh start ci

      - name: hwbench verify
        if: steps.gate.outputs.paused != 'true'
        run: scripts/bench/hw/hwbench.sh verify ci

      # Two passes over the same cluster. smoke is 30s workloads at 1 MiB and
      # answers whether the path works at all; compare is 2m at 64 MiB with
      # 16-part uploads, which is the sizing the harness was written for and
      # the only one that saturates anything.
      #
      # The tag names the results directory and feeds the warp bucket names,
      # which S3 caps at 63 characters, so it stays short. Uniqueness across
      # runs comes from the timestamp the harness already stamps each run with.
      - name: hwbench perf (smoke)
        if: steps.gate.outputs.paused != 'true'
        env:
          PERF_PRESET: smoke
        run: scripts/bench/hw/hwbench.sh perf ci smoke

      # Runs second, so it writes onto disks already holding the smoke pass.
      # clean below empties HW_ROOT at the end of every run, so this is one
      # pass worth of objects rather than an accumulation across runs.
      - name: hwbench perf (compare)
        if: steps.gate.outputs.paused != 'true'
        env:
          PERF_PRESET: compare
        run: scripts/bench/hw/hwbench.sh perf ci compare

      # Results are written on the tools host (the last in HW_HOSTS) and logs
      # on every host, so nothing reaches the runner on its own. clean below
      # deletes the source, so this runs first and runs even on failure.
      - name: Fetch results and host logs
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: |
          set -euo pipefail
          TOOLS_HOST="$(awk '{print $NF}' <<< "$HW_HOSTS")"
          mkdir -p scripts/bench/results/e2e-performance scripts/bench/hw/hostlogs
          scp -q -r -o BatchMode=yes -o ConnectTimeout=10 \
            "$TOOLS_HOST:$HW_ROOT/results/." scripts/bench/results/e2e-performance/ || true
          for h in $HW_HOSTS; do
            hn="${h#*@}"
            mkdir -p "scripts/bench/hw/hostlogs/$hn"
            scp -q -r -o BatchMode=yes -o ConnectTimeout=10 \
              "$h:$HW_ROOT/hostlogs/." "scripts/bench/hw/hostlogs/$hn/" || true
          done

      # Free space where the cluster's data actually lands. Captured before
      # clean, since clean is what frees it, and nothing else in the artefact
      # can say whether a capacity failure was a capacity failure.
      - name: Capture free space on the hardware hosts
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: |
          set -euo pipefail
          for h in $HW_HOSTS; do
            hn="${h#*@}"
            mkdir -p "scripts/bench/hw/hostlogs/$hn"
            ssh -n -o BatchMode=yes -o ConnectTimeout=10 "$h" \
              "df -PB1 '$HW_ROOT'" > "scripts/bench/hw/hostlogs/$hn/disk.txt" 2>/dev/null || true
          done

      # The job measures four times and the summary reports all four. The roots
      # are listed in the order they ran rather than sorted together, so it
      # reads loopback, loopback at 64 KiB, then the two passes on hardware.
      - name: Write run summary
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: |
          set -euo pipefail
          run_dirs=()
          for root in scripts/bench/results/e2e-performance-loopback \
                      scripts/bench/results/e2e-performance-loopback-small \
                      scripts/bench/results/e2e-performance; do
            [ -d "$root" ] || continue
            while IFS= read -r d; do
              [ -n "$d" ] && run_dirs+=("$d")
            done < <(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
          done
          if [ "${#run_dirs[@]}" -gt 0 ]; then
            scripts/bench/perf-summary.sh --hostlogs scripts/bench/hw/hostlogs \
              "${run_dirs[@]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No performance results were found for this run." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Results
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: performance
          # Two roots, not one. A loopback figure and a bare-metal one are not
          # comparable, and interleaving them under a single timestamped tree
          # invites reading one as the other.
          path: |
            scripts/bench/results/e2e-performance/
            scripts/bench/results/e2e-performance-loopback/
            scripts/bench/results/e2e-performance-loopback-small/
            scripts/bench/hw/hostlogs/
          if-no-files-found: ignore
          retention-days: 30

      # Both run under always() so a cancelled run does not leave s3d
      # processes and cluster data behind on the hardware hosts. hwbench.sh
      # substitutes its own defaults for an empty HW_ROOT, so a run that never
      # got past the configuration check must not reach clean.
      - name: hwbench stop
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: scripts/bench/hw/hwbench.sh stop || true

      - name: hwbench clean
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: scripts/bench/hw/hwbench.sh clean || true

      - name: Clean hwbench work dir
        if: always() && steps.gate.outputs.paused != 'true' && steps.config.outcome == 'success'
        run: |
          rm -rf "$HW_WORK"
          git worktree prune || true
