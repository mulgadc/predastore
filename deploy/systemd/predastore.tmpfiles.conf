# Directories for predastore.service, installed to
# /usr/lib/tmpfiles.d/predastore.conf.
#
# Declarative rather than an install script, so the modes are reasserted on
# every boot instead of only at install time.
#
# 0750 on the config directory: it holds the at-rest key and the TLS key, and
# the key loader is fail-closed on anything a group or other can read. Only
# the directory is managed here, so operator-placed key modes are left alone.
d /etc/predastore 0750 predastore predastore -

# 0700 on the data root. Nothing but the service reads object data, and a node
# without its own data_dir derives its directory under here at start.
d /var/lib/predastore 0700 predastore predastore -
