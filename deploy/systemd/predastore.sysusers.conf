# System user for predastore.service, installed to
# /usr/lib/sysusers.d/predastore.conf.
#
# One service, so one user and a group of its own name. A shared group would
# only earn its keep if something else had to read these files, and in a
# standalone deployment nothing does.
#
# The home directory is the data root rather than a real home: it gives the
# account somewhere to exist without /home, which ProtectHome=yes hides anyway.
u predastore - "Predastore object storage" /var/lib/predastore /usr/sbin/nologin
