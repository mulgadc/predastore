# Socket buffers for predastore's QUIC cluster plane. A correctness
# requirement for multi-host, not tuning: quic-go asks for a 7 MiB receive
# buffer, and a clamped limit drops datagrams under load and fails shard writes.
#
# A single-host cluster runs over the in-process pipe and is unaffected.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
