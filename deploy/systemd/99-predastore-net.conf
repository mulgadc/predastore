# Socket buffer limits for predastore, installed to
# /etc/sysctl.d/99-predastore-net.conf.
#
# This is a correctness requirement for any multi-host cluster, not tuning.
# Blob, meta and raft traffic all ride QUIC, and quic-go asks the kernel for a
# 7 MiB receive buffer. Left at the default 208 KiB the request is silently
# clamped and the socket drops datagrams under load, which fails shard writes.
# Nothing reports a misconfigured limit, so the symptom is lost writes rather
# than a refused start.
#
# A single-host cluster runs every node over the in-process pipe and opens no
# QUIC socket, so it is unaffected. Apply with `sysctl --system`.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
